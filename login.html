<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Masuk ke Akun Anda</title>
  <meta name="description" content="Halaman login aman untuk mengakses akun Anda. Masukkan email dan kata sandi untuk melanjutkan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --clr-accent-1: #6c63ff;
      --clr-accent-2: #a78bfa;
      --clr-accent-3: #38bdf8;
      --clr-glass-bg: rgba(255,255,255,0.05);
      --clr-glass-border: rgba(255,255,255,0.12);
      --clr-text-primary: #f1f5f9;
      --clr-text-secondary: #94a3b8;
      --clr-input-bg: rgba(255,255,255,0.07);
      --clr-input-border: rgba(255,255,255,0.15);
      --clr-error: #f87171;
      --radius-card: 24px;
      --radius-input: 12px;
    }
    html, body { min-height: 100vh; font-family: 'Outfit', sans-serif; background-color: #0b0d1a; color: var(--clr-text-primary); overflow-x: hidden; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      position: relative;
      background: radial-gradient(ellipse 120% 80% at 70% 20%, #1a103a 0%, #0b0d1a 60%);
    }
    .bg-blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.4; pointer-events: none; animation: blobFloat 8s ease-in-out infinite alternate; }
    .bg-blob-1 { width:520px;height:520px;background:radial-gradient(circle,#6c63ff 0%,transparent 70%);top:-160px;left:-140px;animation-duration:9s; }
    .bg-blob-2 { width:400px;height:400px;background:radial-gradient(circle,#38bdf8 0%,transparent 70%);bottom:-100px;right:-100px;animation-duration:11s;animation-delay:-4s; }
    .bg-blob-3 { width:280px;height:280px;background:radial-gradient(circle,#a78bfa 0%,transparent 70%);top:50%;left:60%;transform:translate(-50%,-50%);animation-duration:7s;animation-delay:-2s; }
    @keyframes blobFloat { from{transform:translate(0,0) scale(1);}to{transform:translate(30px,-30px) scale(1.08);} }
    body::before { content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.06) 1px,transparent 1px);background-size:36px 36px;pointer-events:none;z-index:0; }
    .card-wrapper { position:relative;z-index:1;width:100%;max-width:440px;animation:cardReveal 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes cardReveal { from{opacity:0;transform:translateY(40px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);} }
    .card { background:var(--clr-glass-bg);border:1px solid var(--clr-glass-border);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border-radius:var(--radius-card);padding:48px 40px;box-shadow:0 25px 60px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.06); }
    .brand { display:flex;align-items:center;gap:12px;margin-bottom:32px; }
    .brand-icon { width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--clr-accent-1),var(--clr-accent-3));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 24px rgba(108,99,255,0.45);flex-shrink:0; }
    .brand-name { font-size:22px;font-weight:700;background:linear-gradient(to right,var(--clr-accent-2),var(--clr-accent-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .card-heading { font-size:28px;font-weight:700;letter-spacing:-0.5px;color:var(--clr-text-primary);margin-bottom:6px; }
    .card-sub { font-size:14px;color:var(--clr-text-secondary);margin-bottom:36px;font-weight:400; }
    .form-group { margin-bottom:20px; }
    label { display:block;font-size:13px;font-weight:500;color:var(--clr-text-secondary);margin-bottom:8px;letter-spacing:0.4px; }
    .input-wrapper { position:relative; }
    .input-icon { position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;color:var(--clr-text-secondary);transition:color 0.2s; }
    input[type="email"],input[type="password"],input[type="text"] { width:100%;padding:13px 14px 13px 42px;background:var(--clr-input-bg);border:1px solid var(--clr-input-border);border-radius:var(--radius-input);color:var(--clr-text-primary);font-family:inherit;font-size:15px;font-weight:400;outline:none;transition:border-color 0.25s,box-shadow 0.25s,background 0.25s; }
    input::placeholder { color:rgba(148,163,184,0.5); }
    input:focus { border-color:var(--clr-accent-1);background:rgba(108,99,255,0.08);box-shadow:0 0 0 3px rgba(108,99,255,0.2); }
    .input-wrapper:focus-within .input-icon { color:var(--clr-accent-2); }
    .toggle-password { position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--clr-text-secondary);font-size:16px;padding:4px;transition:color 0.2s; }
    .toggle-password:hover { color:var(--clr-accent-2); }
    .options-row { display:flex;align-items:center;justify-content:space-between;margin:6px 0 28px;flex-wrap:wrap;gap:8px; }
    .remember-me { display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--clr-text-secondary);user-select:none; }
    .remember-me input[type="checkbox"] { display:none; }
    .custom-check { width:18px;height:18px;border-radius:5px;border:1.5px solid var(--clr-input-border);background:var(--clr-input-bg);display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;padding:0; }
    .remember-me input:checked ~ .custom-check { background:var(--clr-accent-1);border-color:var(--clr-accent-1); }
    .custom-check svg { display:none; }
    .remember-me input:checked ~ .custom-check svg { display:block; }
    .forgot-link { font-size:13px;color:var(--clr-accent-2);text-decoration:none;font-weight:500;transition:color 0.2s,text-shadow 0.2s; }
    .forgot-link:hover { color:var(--clr-accent-3);text-shadow:0 0 12px rgba(167,139,250,0.5); }
    .btn-login { width:100%;padding:14px;font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--clr-accent-1) 0%,#5b52e8 50%,#4338ca 100%);border:none;border-radius:var(--radius-input);cursor:pointer;position:relative;overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 8px 30px rgba(108,99,255,0.45);letter-spacing:0.3px; }
    .btn-login::before { content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);opacity:0;transition:opacity 0.2s; }
    .btn-login:hover { transform:translateY(-2px);box-shadow:0 12px 40px rgba(108,99,255,0.6); }
    .btn-login:hover::before { opacity:1; }
    .btn-login:active { transform:translateY(0);box-shadow:0 6px 20px rgba(108,99,255,0.4); }
    .btn-login .spinner { display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto; }
    .btn-login.loading .btn-text { display:none; }
    .btn-login.loading .spinner { display:block; }
    @keyframes spin { to{transform:rotate(360deg);} }
    .divider { display:flex;align-items:center;gap:12px;margin:28px 0;color:rgba(148,163,184,0.4);font-size:12px;letter-spacing:0.6px;text-transform:uppercase; }
    .divider::before,.divider::after { content:'';flex:1;height:1px;background:var(--clr-glass-border); }
    .social-row { display:flex;gap:12px; }
    .btn-social { flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;background:var(--clr-input-bg);border:1px solid var(--clr-input-border);border-radius:var(--radius-input);color:var(--clr-text-secondary);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;text-decoration:none; }
    .btn-social:hover { background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25);color:var(--clr-text-primary);transform:translateY(-1px); }
    .btn-social svg { width:18px;height:18px;flex-shrink:0; }
    .card-footer { margin-top:32px;text-align:center;font-size:14px;color:var(--clr-text-secondary); }
    .card-footer a { color:var(--clr-accent-2);text-decoration:none;font-weight:500;transition:color 0.2s; }
    .card-footer a:hover { color:var(--clr-accent-3); }
    .error-msg { display:none;align-items:center;gap:8px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--clr-error);margin-bottom:20px;animation:shake 0.3s ease; }
    .error-msg.visible { display:flex; }
    @keyframes shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);} }
    @media (max-width:480px) { .card{padding:36px 24px;}.social-row{flex-direction:column;} }
  </style>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="card-wrapper">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">&#10022;</div>
        <span class="brand-name">NovaSphere</span>
      </div>
      <h1 class="card-heading">Selamat Datang Kembali</h1>
      <p class="card-sub">Masuk untuk melanjutkan ke dasbor Anda</p>
      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Email atau kata sandi tidak valid.</span>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required />
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required />
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan/sembunyikan kata sandi">
              <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="options-row">
          <label class="remember-me" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="custom-check">
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>
            </span>
            Ingat saya
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Lupa kata sandi?</a>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Masuk</span>
          <div class="spinner"></div>
        </button>
      </form>
      <div class="divider">atau lanjutkan dengan</div>
      <div class="social-row">
        <button type="button" class="btn-social" id="btnGoogle">
          <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="btn-social" id="btnGithub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </button>
      </div>
      <p class="card-footer">Belum punya akun? <a href="#" id="linkRegister">Daftar sekarang</a></p>
    </div>
  </div>
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput  = document.getElementById('password');
    const eyeShow = document.getElementById('eyeShow');
    const eyeHide = document.getElementById('eyeHide');
    togglePassword.addEventListener('click', () => {
      const hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      eyeShow.style.display = hidden ? 'none' : 'block';
      eyeHide.style.display = hidden ? 'block' : 'none';
    });
    const loginForm = document.getElementById('loginForm');
    const loginBtn  = document.getElementById('loginBtn');
    const errorMsg  = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.add('visible');
      errorMsg.style.animation = 'none';
      errorMsg.offsetHeight;
      errorMsg.style.animation = '';
    }
    function hideError() { errorMsg.classList.remove('visible'); }
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email) { showError('Silakan masukkan alamat email Anda.'); document.getElementById('email').focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Format email tidak valid.'); document.getElementById('email').focus(); return; }
      if (!password) { showError('Silakan masukkan kata sandi Anda.'); document.getElementById('password').focus(); return; }
      if (password.length < 6) { showError('Kata sandi minimal 6 karakter.'); document.getElementById('password').focus(); return; }
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      await new Promise(r => setTimeout(r, 1800));
      if (email === 'demo@email.com' && password === 'password123') {
        loginBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        loginBtn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
        loginBtn.style.boxShadow  = '0 8px 30px rgba(34,197,94,0.45)';
        setTimeout(() => {
          alert('Login berhasil! Selamat datang, Demo User.');
          loginBtn.innerHTML = '<span class="btn-text">Masuk</span><div class="spinner"></div>';
          loginBtn.style.background = '';
          loginBtn.style.boxShadow  = '';
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
        }, 1000);
      } else {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        showError('Email atau kata sandi salah. Coba: demo@email.com / password123');
      }
    });
    document.getElementById('btnGoogle').addEventListener('click', () => alert('Masuk dengan Google (belum diimplementasikan).'));
    document.getElementById('btnGithub').addEventListener('click', () => alert('Masuk dengan GitHub (belum diimplementasikan).'));
    document.getElementById('linkRegister').addEventListener('click', e => { e.preventDefault(); alert('Halaman registrasi belum tersedia.'); });
    document.getElementById('forgotLink').addEventListener('click', e => { e.preventDefault(); alert('Halaman lupa kata sandi belum tersedia.'); });
    document.getElementById('email').addEventListener('input', hideError);
    document.getElementById('password').addEventListener('input', hideError);
  </script>
</body>
</html>
