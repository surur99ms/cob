<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyek – PortoManage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --clr-bg-1: #0b0d1a;
      --clr-accent-1: #6c63ff;
      --clr-accent-2: #a78bfa;
      --clr-accent-3: #38bdf8;
      --clr-glass-bg: rgba(255,255,255,0.05);
      --clr-glass-border: rgba(255,255,255,0.12);
      --clr-text-primary: #f1f5f9;
      --clr-text-secondary: #94a3b8;
      --clr-card-bg: rgba(255,255,255,0.03);
      --radius-card: 20px;
      --radius-sm: 12px;
      --clr-error: #f87171;
    }
    body {
      font-family: 'Outfit', sans-serif; background-color: var(--clr-bg-1); color: var(--clr-text-primary);
      min-height: 100vh; display: flex; overflow-x: hidden;
      background: radial-gradient(ellipse 120% 80% at 70% 20%, #1a103a 0%, #0b0d1a 60%);
    }
    body::before { content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.06) 1px,transparent 1px);background-size:36px 36px;pointer-events:none;z-index:0; }
    
    .sidebar { width: 260px; background: var(--clr-glass-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--clr-glass-border); padding: 24px; display: flex; flex-direction: column; z-index: 10; position: relative; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--clr-accent-1), var(--clr-accent-3)); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 12px rgba(108,99,255,0.4); }
    .brand-name { font-size: 20px; font-weight: 700; background: linear-gradient(to right, var(--clr-accent-2), var(--clr-accent-3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 8px; border-radius: var(--radius-sm); color: var(--clr-text-secondary); text-decoration: none; font-weight: 500; transition: all 0.2s; }
    .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.08); color: var(--clr-text-primary); }
    .nav-item.active { background: linear-gradient(90deg, rgba(108,99,255,0.15), transparent); border-left: 3px solid var(--clr-accent-1); }
    .nav-item svg { width: 20px; height: 20px; }
    .sidebar-footer { margin-top: auto; }
    
    .main-content { flex: 1; padding: 32px 40px; display: flex; flex-direction: column; z-index: 1; height: 100vh; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .page-title { font-size: 28px; font-weight: 600; }
    
    .header-actions { display: flex; gap: 16px; align-items: center; }
    .btn-primary { background: linear-gradient(135deg, var(--clr-accent-1), var(--clr-accent-3)); color: white; border: none; padding: 12px 24px; border-radius: var(--radius-sm); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(108,99,255,0.4); transition: transform 0.2s, box-shadow 0.2s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(108,99,255,0.6); }
    
    .user-profile { display: flex; align-items: center; gap: 16px; border-left: 1px solid var(--clr-glass-border); padding-left: 16px; }
    .user-info { text-align: right; }
    .user-name { font-weight: 600; font-size: 15px; }
    .user-role { font-size: 13px; color: var(--clr-text-secondary); }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--clr-accent-1); display: flex; align-items: center; justify-content: center; font-weight: 600; border: 2px solid var(--clr-glass-border); }
    
    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input { background: var(--clr-glass-bg); border: 1px solid var(--clr-glass-border); color: var(--clr-text-primary); padding: 12px 16px; border-radius: var(--radius-sm); width: 300px; outline: none; font-family: inherit; }
    .search-input:focus { border-color: var(--clr-accent-1); }
    .filter-btn { background: var(--clr-glass-bg); border: 1px solid var(--clr-glass-border); color: var(--clr-text-primary); padding: 12px 16px; border-radius: var(--radius-sm); font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .filter-btn:hover { background: rgba(255,255,255,0.1); }
    
    .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .project-card { background: var(--clr-card-bg); border: 1px solid var(--clr-glass-border); backdrop-filter: blur(10px); border-radius: var(--radius-card); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; position: relative; group; }
    .project-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2); }
    
    .project-img { height: 160px; background: linear-gradient(45deg, #2d2b4d, #1f2937); position: relative; overflow: hidden; }
    .project-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
    .project-card:hover .project-img img { opacity: 1; }
    
    .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.3); color: #4ade80; backdrop-filter: blur(4px); }
    .status-badge.draft { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }
    
    .project-info { padding: 20px; }
    .project-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--clr-text-primary); }
    .project-client { font-size: 14px; color: var(--clr-accent-3); margin-bottom: 16px; font-weight: 500; }
    
    .project-stats { display: flex; gap: 16px; margin-bottom: 20px; }
    .stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--clr-text-secondary); }
    .stat svg { width: 14px; height: 14px; }
    
    .project-actions { display: flex; gap: 8px; border-top: 1px solid var(--clr-glass-border); padding-top: 16px; }
    .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--clr-glass-border); background: transparent; color: var(--clr-text-primary); cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-action:hover { background: rgba(255,255,255,0.1); }
    .btn-action.edit:hover { border-color: var(--clr-accent-1); color: var(--clr-accent-2); }
    .btn-action.delete:hover { border-color: var(--clr-error); color: var(--clr-error); }
    
    @media (max-width: 1024px) { .portfolio-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--clr-glass-border); padding: 16px; } .brand { margin-bottom: 16px; } .main-content { padding: 20px; } .portfolio-grid { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; gap: 20px; } .header-actions { width: 100%; justify-content: space-between; } .filter-bar { flex-direction: column; } .search-input { width: 100%; } }
  </style>
</head>

      <a href="portfolio.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>Proyek</a>
